name: build-mac

# macOS 安装包只能在 macOS 上构建（dmg 需要 hdiutil，签名工具链也只有 mac 有），
# 所以 Windows 本机跑不了这条链路，交给 GitHub 的 macOS runner。
#
# 触发方式：
#   1. 推 tag（v0.1.0 这种）→ 出包 + 建 Release
#   2. 手动在 Actions 页面点「Run workflow」→ 只出包，产物在页面底部可下载
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # tag 触发时用 GITHUB_TOKEN 建 Release

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查与单测
        run: |
          npm run typecheck
          npx vitest run

      - name: 构建（arm64 + x64 两个 dmg）
        # 必须先 electron-vite build 出 out/，electron-builder 才有东西可打包。
        # out/ 是 .gitignore 的，CI checkout 下来是空的——直接 electron-builder
        # 会报「Application entry file out/main/index.js does not exist」。
        # dist:mac 就是 npm run build && electron-builder --mac --publish never。
        # --publish never 不能省：推 tag 触发的运行里，electron-builder 会自己
        # 检测到 git tag 就去上传 Release（日志里的 "Implicit publishing
        # triggered by git tag"），而它没有 GH_TOKEN，dmg 明明已经打好了
        # 却在这一步 exit 1。发布交给下面的 softprops/action-gh-release。
        run: npm run dist:mac
        env:
          # 没有 Apple 开发者账号：显式关掉证书自动发现，
          # 否则 electron-builder 会去钥匙串里翻一圈再报「找不到签名身份」
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 列出产物
        run: ls -lh release

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: |
            release/*.dmg
          if-no-files-found: error

      # 推 tag 时顺手建成 Release，用户直接点链接下载，不用登录 Actions
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
          draft: false
          generate_release_notes: true
